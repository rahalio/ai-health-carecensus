        caveats:
          type: array
          items:
            type: string
        reconciliations:
          type: array
          items:
            type: object
            properties:
              signatory:
                type: string
              role:
                type: string
              signedAt:
                type: string
                format: date-time
    DuplicationFinding:
      type: object
      required: [id, jobDescription, deploymentIds, status]
      properties:
        id:
