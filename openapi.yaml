        deploymentId:
          type: string
        period:
          type: string
        measure:
          type: string
        baselineValue:
          type: number
          format: float
        observedValue:
          type: number
          format: float
        hypothesisTarget:
          type: number
          format: float
        outcome:
          type: string
          enum: [exceeded, met, partial, null_result, negative, unmeasurable]
        attributionRuleId:
