        licenceCost:
          $ref: "#/components/schemas/Money"
        integrationCost:
          $ref: "#/components/schemas/Money"
        validationCost:
          $ref: "#/components/schemas/Money"
        monitoringCost:
          $ref: "#/components/schemas/Money"
        clinicianTimeCost:
          $ref: "#/components/schemas/Money"
        totalCost:
          $ref: "#/components/schemas/Money"
