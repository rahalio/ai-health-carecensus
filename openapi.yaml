    GateReview:
      type: object
      required: [id, deploymentId, fromStage, toStage, status]
      properties:
        id:
          type: string
        deploymentId:
          type: string
        fromStage:
          $ref: "#/components/schemas/LifecycleStage"
        toStage:
          $ref: "#/components/schemas/LifecycleStage"
        status:
          type: string
          enum: [draft, submitted, evidence_incomplete, in_review, decided, withdrawn]
        requiredEvidence:
          type: array
          items:
            type: object
            properties:
              item:
                type: string
              satisfied:
                type: boolean
              reference:
                type: string
        linkedSafetyEventIds:
          type: array
          items:
            type: string
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        decision:
          $ref: "#/components/schemas/GateDecision"
    GateReviewCreate:
      type: object
      required: [deploymentId, toStage, submittedBy]
      properties:
        deploymentId:
          type: string
        toStage:
          $ref: "#/components/schemas/LifecycleStage"
        submittedBy:
          type: string
        requestedScope:
          $ref: "#/components/schemas/DeploymentScope"
        evidenceReferences:
          type: array
          items:
            type: string
    GateDecisionCreate:
      type: object
      required: [outcome, decidedBy, rationale]
      properties:
        outcome:
          type: string
          enum: [approved, approved_with_conditions, deferred, rejected]
        decidedBy:
          type: string
        committee:
          type: string
        rationale:
          type: string
        conditions:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
              dueBy:
                type: string
                format: date
              ownerId:
                type: string
        approvedScope:
          $ref: "#/components/schemas/DeploymentScope"
    GateDecision:
      type: object
      required: [outcome, decidedBy, decidedAt]
      properties:
        outcome:
          type: string
          enum: [approved, approved_with_conditions, deferred, rejected]
        decidedBy:
          type: string
        committee:
          type: string
        decidedAt:
          type: string
          format: date-time
        rationale:
          type: string
        conditions:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
              dueBy:
                type: string
                format: date
              ownerId:
                type: string
              satisfied:
                type: boolean
    DeploymentScope:
      type: object
      properties:
        sites:
          type: array
          items:
            type: string
        serviceLines:
          type: array
          items:
            type: string
        populationDescription:
          type: string
        workflowDescription:
          type: string
        observedSites:
          type: array
          items:
            type: string
        scopeCreepDetected:
          type: boolean
        creepDetail:
          type: string
    MonitoringSignal:
      type: object
      required: [deploymentId, signalType, observedAt]
      properties:
        id:
          type: string
        deploymentId:
          type: string
        deploymentVersionId:
          type: string
        signalType:
          type: string
          enum: [performance_drift, calibration_drift, input_shift, utilisation_drop, override_rate, subgroup_divergence]
        observedAt:
          type: string
          format: date-time
        measure:
          type: string
        value:
          type: number
          format: float
        thresholdBreached:
          type: boolean
        ownerId:
          type: string
        reviewDueBy:
          type: string
          format: date
        sourceSystem:
          type: string
    SafetyEventLink:
      type: object
      required: [safetyEventRef, linkStrength]
      properties:
        id:
          type: string
        deploymentId:
          type: string
        safetyEventRef:
          type: string
          description: Identifier in the patient-safety event reporting system
        linkStrength:
          type: string
          enum: [suspected, plausible, probable, confirmed, ruled_out]
        harmLevel:
          type: string
          enum: [no_harm, near_miss, temporary_harm, permanent_harm, death]
        reportedAt:
          type: string
          format: date-time
        externalReportingRequired:
          type: boolean
          description: True where a device classification triggers post-market reporting
        narrative:
          type: string
    AttributionRule:
      type: object
      required: [id, name, method]
      properties:
        id:
          type: string
        name:
          type: string
        method:
          type: string
          enum: [pre_post_with_control, difference_in_differences, stepped_wedge, matched_cohort, counterfactual_estimate]
        confoundersAddressed:
          type: array
          items:
            type: string
        agreedWith:
          type: array
          items:
            type: string
        agreedAt:
          type: string
          format: date-time
    RealizedValueStatement:
      type: object
      required: [id, deploymentId, period, outcome]
      properties:
